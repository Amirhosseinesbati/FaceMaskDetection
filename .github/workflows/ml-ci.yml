name: ML Pipeline CI

# مشخص کردن زمان اجرای CI (Trigger Events)
on:
  push:
    branches: 
      - "main"
      - "develop"
  pull_request:
    branches: 
      - "develop"

jobs:
  lint-test-and-smoke:
    runs-on: ubuntu-latest
    
    # متغیرهای محیطی که به پایتون پاس داده می‌شوند
    env:
      CI: true
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    # استفاده از پایتون 3.12 طبق درخواست شما
    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip' # کش کردن پکیج‌ها برای سرعت بیشتر در اجراهای بعدی

    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        
        # نصب PyTorch نسخه CPU برای کاهش شدید زمان نصب و مصرف ترافیک CI
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
        # نصب سایر وابستگی‌های پروژه
        pip install zenml mlflow dagshub kagglehub opencv-python-headless

    # - name: 🧹 Code Quality (Linting & Formatting)
    #   run: |
    #     ruff check .
    #     ruff format --check .

    - name: 🧪 Run Unit Tests (Architecture & Logic Validation)
      run: |
        pytest tests/ -v -W ignore::DeprecationWarning

    - name: ⚙️ Initialize ZenML Orchestrator
      run: |
        zenml init

    - name: 🚀 Run Integration / Smoke Test
      run: |
        # اجرای پایپ‌لاین کامل در حالت سبک (متغیر CI=true در کد پایتون این را مدیریت می‌کند)
        python src/pipeline/pipeline.py
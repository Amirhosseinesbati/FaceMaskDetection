name: 🚀 CD - Build & Push Docker Images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]   # روی تگ‌های نسخه هم اجرا شود
  workflow_dispatch:    # امکان اجرای دستی

env:
  API_IMAGE: ${{ secrets.DOCKER_USERNAME }}/mask-detection-api
  UI_IMAGE: ${{ secrets.DOCKER_USERNAME }}/mask-detection-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ---------- مرحله ۱: چک‌اوت کد ----------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ---------- مرحله ۲: Buildx برای build بهینه ----------
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- مرحله ۳: لاگین به Docker Hub ----------
      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- مرحله ۴: ساخت تگ‌های خودکار ----------
      - name: 🏷️ Generate metadata (API)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: 🏷️ Generate metadata (UI)
        id: meta_ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      # ---------- مرحله ۵: Build & Push ایمیج API ----------
      - name: 🐳 Build & Push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DAGSHUB_USERNAME=${{ secrets.DAGSHUB_USERNAME }}
            DAGSHUB_REPO_NAME=${{ secrets.DAGSHUB_REPO_NAME }}

      # ---------- مرحله ۶: Build & Push ایمیج Streamlit ----------
      - name: 🎨 Build & Push Streamlit image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker/Dockerfile.streamlit
          push: true
          tags: ${{ steps.meta_ui.outputs.tags }}
          labels: ${{ steps.meta_ui.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- مرحله ۷: خلاصه نتایج ----------
      - name: ✅ Summary
        run: |
          echo "### 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| API | \`${{ env.API_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| UI  | \`${{ env.UI_IMAGE }}:latest\` |" >> $GITHUB_STEP_SUMMARY